#
# Copyright and licensing for files that cannot carry a comment header
# (https://reuse.software/spec/): images, Markdown, and
# src/pkg-description.txt, whose text LibreOffice shows to users as is.
# Every other file states both in its own header.
version = 1

[[annotations]]
path = [
    "**.md",
    "icons-src/*.svg",
    "src/icons/*.png",
    "src/pkg-description.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2026 Blagovest Petrov <blagovest@petrovs.info>",
    "2026 Vute Tech Ltd. <https://vute.tech>",
]
SPDX-License-Identifier = "GPL-3.0-or-later"
